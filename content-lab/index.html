<title>Videobolt Content Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an edit-suite workspace. A track rail on the left (five tracks = five stages of the pipeline), a working canvas on the right. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E4E7EE; --ink:#14161D; --muted:#596074; --line:#D3D7E0;
  --accent:#2B45D4; --accent-ink:#FFFFFF; --accent-soft:#E2E6FB;
  --rec:#CF3229; --ok:#1C8550; --warn:#A86E12; --star:#D99A0B;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1016; --surface:#171A22; --sunk:#1E222C; --ink:#E7E9EF; --muted:#959BAC; --line:#2A2F3B;
  --accent:#7D90FF; --accent-ink:#0E1016; --accent-soft:#222949;
  --rec:#FF6A62; --ok:#4CC38A; --warn:#E2A748; --star:#F2B83A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A22; --sunk:#1E222C; --ink:#E7E9EF; --muted:#959BAC; --line:#2A2F3B;
  --accent:#7D90FF; --accent-ink:#0E1016; --accent-soft:#222949;
  --rec:#FF6A62; --ok:#4CC38A; --warn:#E2A748; --star:#F2B83A; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:19px;letter-spacing:-.01em;line-height:1.1;padding-inline:8px}
.brand small{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-stretch:100%}
.tracks{display:flex;flex-direction:column;gap:2px}
.track{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:9px 8px;border-radius:var(--r);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.track:hover{background:var(--sunk)}
.track[aria-current="true"]{background:var(--accent-soft)}
.track .tid{font:500 11px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:4px 0;text-align:center;background:var(--bg)}
.track[aria-current="true"] .tid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.track .tname{font-weight:600;font-size:14px}
.track .tsub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.track .tcount{font:500 11px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.status{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.rec{background:var(--rec)}

main{padding-inline:clamp(16px,3.5vw,44px);padding-block:28px 80px;min-width:0}
.vhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.vhead h1{font-family:var(--f-display);font-weight:780;font-stretch:112%;font-size:clamp(26px,3.2vw,36px);line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.vhead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.subtabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunk);padding:3px;border-radius:8px}
.subtabs button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:17px;margin:0 0 4px;letter-spacing:-.005em}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em;min-width:0}
label.f span.opt{font-weight:400}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;font-weight:400;letter-spacing:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:14px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.5}
textarea.tall{min-height:180px}
textarea.code{font-family:var(--f-mono);font-size:13px;min-height:320px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--rec)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--muted)}
.item h3{font-size:15px;font-weight:600;margin:0;line-height:1.35}
.item p{margin:0;font-size:14px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--f-mono);letter-spacing:.03em;padding:4px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.rec{color:var(--rec)}
.chip.ignore{color:var(--muted)} .chip.counter{color:var(--rec)} .chip.borrow{color:var(--ok)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:8px}
.empty strong{color:var(--ink);font-weight:600}
.note{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink)}
.out{white-space:pre-wrap;font-size:14px}
.err{color:var(--rec);font-size:13px}

.stars{display:inline-flex;gap:1px}
.stars button{border:0;background:none;padding:0 1px;cursor:pointer;font-size:16px;line-height:1;color:var(--line)}
.stars button.on{color:var(--star)}

/* keyframe stage rail for scripts: each diamond is one stage, filled when approved */
.kf{display:flex;align-items:center;gap:0;margin:4px 0 16px;overflow-x:auto}
.kf button{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:6px 10px 6px 0;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.kf button .dia{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--muted);background:transparent;flex:none}
.kf button.done .dia{background:var(--ok);border-color:var(--ok)}
.kf button.cur{color:var(--ink)}
.kf button.cur .dia{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kf .wire{flex:1;min-width:16px;height:1.5px;background:var(--line);margin-right:10px}

.tc{font:500 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.kv dt{font:500 11px/1.9 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv dd{margin:0;min-width:0}
.sec{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.sec h4{margin:0;font:500 11px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec ol,.sec ul{margin:0;padding-left:20px}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.checks{display:flex;flex-direction:column;gap:4px;font-size:13px}
.checks .ok{color:var(--ok)} .checks .no{color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.rowedit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rowedit .fields{display:flex;flex-direction:column;gap:6px;min-width:0}

.savebar{position:sticky;bottom:0;margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -4px 18px rgba(0,0,0,.06)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(720px,100%);height:100%;overflow:auto;padding:calc(22px + env(safe-area-inset-top,0px)) clamp(16px,3vw,28px) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.drawer h2{font-family:var(--f-display);font-stretch:110%;font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* teleprompter */
.prompter{position:fixed;inset:0;background:#000;color:#fff;z-index:70;display:flex;flex-direction:column}
.prompter .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:#111;font-size:13px}
.prompter .bar button{background:#222;color:#fff;border:1px solid #333;border-radius:6px;padding:6px 12px;cursor:pointer}
.prompter .bar label{display:flex;gap:6px;align-items:center;color:#bbb}
.prompter .scroll{flex:1;overflow:hidden;position:relative}
.prompter .text{padding:40vh 8vw 80vh;font:600 var(--psize,44px)/1.4 var(--f-body);white-space:pre-wrap;will-change:transform}
.prompter .text.mirror{transform:scaleX(-1)}
.prompter .guide{position:absolute;left:0;right:0;top:38vh;height:2px;background:rgba(255,80,70,.6);pointer-events:none}

@media (max-width:980px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand small,.status,.track .tsub,.track .tcount{display:none}
  .brand{font-size:15px;padding:0;white-space:nowrap}
  .tracks{flex-direction:row}
  .track{grid-template-columns:auto auto;padding:7px 8px}
  .track .tid{width:30px}
  .track .tname{font-size:13px;white-space:nowrap}
}
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">Videobolt<br>Content Lab<small>Concept → script</small></div>
    <div class="tracks" id="tracks"></div>
    <div class="status" id="status">
      <div><span class="dot" id="st-db"></span><span id="st-db-t">Connecting…</span></div>
      <div><span class="dot" id="st-ai"></span><span id="st-ai-t">Checking generation…</span></div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

<script>
(() => {
'use strict';
// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const byNew = (a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}); };
const num = v => { const n = Number(String(v ?? '').replace(/[, ]/g, '').replace(/k$/i, '000').replace(/m$/i, '000000')); return isFinite(n) && n > 0 ? n : 0; };
const short = n => n >= 1e6 ? (n/1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e3 ? (n/1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K' : String(n || 0);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const list = v => Array.isArray(v) ? v : (v ? [v] : []);

let toastT;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
}

// ---------- state ----------
const COLLS = ['teardowns','patterns','competitors','watch','digests','shifts','concepts','scripts'];
const S = { bible: {}, teardowns: [], patterns: [], competitors: [], watch: [], digests: [], shifts: [], concepts: [], scripts: [] };
const UI = {
  view: (lsGet('vbl-view') || 'bible'), sub: lsGet('vbl-sub') || {},
  genResults: [], genSeed: null, scriptId: lsGet('vbl-script') || null, stage: 'beats',
  tdImages: [], watchImages: [], bibleDraft: null, bibleDirty: false, patFilter: 'all', boardFilter: 'all',
};
const VIEWS = [
  {id:'bible', tid:'V1', name:'Brand bible', sub:'Voice, series, personas'},
  {id:'teardown', tid:'V2', name:'Teardowns', sub:'Reference videos, patterns'},
  {id:'watch', tid:'V3', name:'Market watch', sub:'Competitors, digests'},
  {id:'concepts', tid:'V4', name:'Concepts', sub:'Generate, rate, shortlist'},
  {id:'scripts', tid:'V5', name:'Scripts', sub:'Beats to captions'},
];
if (!VIEWS.some(v => v.id === UI.view)) UI.view = 'bible';
const hashView = location.hash.replace('#', ''); if (VIEWS.some(v => v.id === hashView)) UI.view = hashView;

// ---------- storage: shared db with local fallback ----------
const LKEY = 'vbl-local-v1';
const store = {
  mode: 'loading', db: null, chains: {},
  async init() {
    let db = null;
    try { db = window.claude?.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (db) {
      this.mode = 'shared'; this.db = db;
      db.doc('brand/bible').onSnapshot(d => { S.bible = d.exists ? clone(d.data()) : {}; onData('bible'); }, e => this.fail(e));
      for (const c of COLLS) db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({ ...clone(d.data()), id: d.id })).sort(byNew); onData(c); }, e => this.fail(e));
    } else {
      this.mode = 'local';
      const saved = lsGet(LKEY) || {};
      S.bible = saved.bible || {};
      for (const c of COLLS) S[c] = (saved[c] || []).sort(byNew);
      onData('*');
    }
    paintStatus();
  },
  fail(e) { if (e?.code === 'revoked') { this.mode = 'readonly'; paintStatus(); } },
  persistLocal() { const o = { bible: S.bible }; for (const c of COLLS) o[c] = S[c]; lsSet(LKEY, o); },
  // one write at a time per document; later writes for the same doc coalesce
  write(key, fn) {
    const ch = this.chains[key] || (this.chains[key] = { running: null, next: null });
    ch.next = fn;
    if (!ch.running) {
      const run = async () => { const f = ch.next; ch.next = null; try { await f(); } catch (e) { handleWriteError(e); } if (ch.next) return run(); ch.running = null; };
      ch.running = run();
    }
    return ch.running;
  },
  put(coll, id, data) {
    const body = { ...clone(data), id, updatedAt: now() }; if (!body.createdAt) body.createdAt = now();
    if (this.mode === 'shared') return this.write(coll + '/' + id, () => this.db.collection(coll).doc(id).set(body));
    const arr = S[coll]; const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = body; else arr.unshift(body);
    arr.sort(byNew); this.persistLocal(); onData(coll); return Promise.resolve();
  },
  del(coll, id) {
    if (this.mode === 'shared') return this.write(coll + '/' + id, () => this.db.collection(coll).doc(id).delete());
    S[coll] = S[coll].filter(x => x.id !== id); this.persistLocal(); onData(coll); return Promise.resolve();
  },
  putBible(data) {
    const body = { ...clone(data), updatedAt: now() };
    if (this.mode === 'shared') return this.write('brand/bible', () => this.db.doc('brand/bible').set(body));
    S.bible = body; this.persistLocal(); onData('bible'); return Promise.resolve();
  },
};
function handleWriteError(e) {
  if (e?.code === 'invalid_argument') { toast('You have view-only access, so changes are not saved.'); }
  else if (e?.code === 'quota_exceeded') toast('Storage is full. Delete old teardowns or logs to make room.');
  else toast('Could not save. Check your connection and try again.');
}
const get = (coll, id) => S[coll].find(x => x.id === id);

// ---------- Claude in the page ----------
let SAMPLE = null, IMG = null, DL = null;
async function initSample() {
  try { SAMPLE = window.claude?.use ? await window.claude.use('sample') : null; } catch { SAMPLE = null; }
  if (SAMPLE) { try { IMG = (await SAMPLE.limits())?.images || null; } catch { IMG = null; } }
  try { DL = window.claude?.use ? await window.claude.use('downloads') : null; } catch { DL = null; }
  paintStatus(); render();
}
async function ask(prompt, { json = false, images, onText, tier } = {}) {
  if (!SAMPLE) throw { code: 'unavailable', message: 'Generation is not available in this view. Open the page on claude.ai while signed in.' };
  const opts = { cache: false };
  if (images && images.length && IMG) opts.images = images.slice(0, IMG.maxCount || 4);
  if (onText) opts.onText = onText;
  if (tier) opts.modelTier = tier;
  return json ? SAMPLE.json(prompt, opts) : (await SAMPLE(prompt, opts)).text;
}
function errCopy(e) {
  switch (e?.code) {
    case 'not_granted': return 'Generation was declined for this page. Reload the page and allow it to use Claude.';
    case 'rate_limited': return 'Too many requests in a row. Wait a minute, then try again.';
    case 'invalid_json': return 'The answer came back in an unexpected shape. Try again.';
    case 'prompt_too_large': return 'Too much text to send at once. Shorten the transcript or the reference scripts.';
    case 'image_rejected': return 'One of the screenshots could not be read. Use JPEG, PNG or WebP.';
    case 'cancelled': return 'Stopped.';
    default: return e?.message || 'Something went wrong. Try again.';
  }
}
async function busy(btn, label, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = label;
  try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; }
}

// ---------- brand context (fed to every prompt) ----------
const BIBLE_FIELDS = [
  ['about', 'What Videobolt is'], ['voice', 'Voice and tone'], ['use', 'Words and phrases we use'], ['avoid', 'Words and phrases we avoid'],
  ['audiences', 'Audiences'], ['pillars', 'Content pillars'], ['ctas', 'Calls to action'], ['platforms', 'Platforms and specs'],
];
function brandContext(limit = 2400) {
  const b = S.bible || {};
  const out = ['BRAND BIBLE: VIDEOBOLT'];
  for (const [k, label] of BIBLE_FIELDS) if (b[k]?.trim()) out.push(`${label}:\n${b[k].trim()}`);
  const series = list(b.series).filter(s => s.name);
  if (series.length) out.push('Series and formats:\n' + series.map(s => `- ${s.name}${s.desc ? ': ' + s.desc : ''}`).join('\n'));
  const per = list(b.personas).filter(p => p.name);
  if (per.length) out.push('Accounts and personas:\n' + per.map(p => `- ${p.name}${p.handle ? ' (' + p.handle + ')' : ''}${p.desc ? ': ' + p.desc : ''}`).join('\n'));
  const refs = list(b.refs).filter(r => r.text);
  if (refs.length) out.push('Reference scripts we consider on-brand (match this voice):\n' + refs.slice(0, 4).map(r => `### ${r.title || 'Untitled'}\n${r.text.slice(0, limit)}`).join('\n\n'));
  if (out.length === 1) out.push('(The brand bible is mostly empty. Write in a clear, confident, creator-friendly voice for a motion graphics and video template company, and say in whyOnBrand fields that the bible needs filling in.)');
  return out.join('\n\n');
}
const wpm = () => num(S.bible?.wpm) || 150;

  d.className = 'dot ' + (store.mode === 'shared' ? 'on' : store.mode === 'loading' ? '' : 'warn');

function go(view) {

function sub(view, def) { return UI.sub[view] || def; }

  if (store.mode !== 'loading' && $('#main').children.length === 0) { render(); return; }

}

function bibleScore(b = S.bible || {}) {
  const checks = [
    ['Voice and tone', !!b.voice?.trim()], ['Words to use and avoid', !!(b.use?.trim() && b.avoid?.trim())],
    ['Audiences', !!b.audiences?.trim()], ['Content pillars', !!b.pillars?.trim()],
    ['At least two series or formats', list(b.series).filter(s => s.name).length >= 2],
    ['Account personas', list(b.personas).filter(p => p.name).length >= 1],
    ['Calls to action', !!b.ctas?.trim()], ['Two or more reference scripts', list(b.refs).filter(r => r.text?.trim()).length >= 2],
  ];
  return { checks, pct: Math.round(100 * checks.filter(c => c[1]).length / checks.length) };
}

  if (!v || !f) return null;
  const r = v / f;
  return { r, label: r >= 3 ? 'Outlier' : r >= 1 ? 'Above reach' : 'Typical for account', cls: r >= 3 ? 'ok' : r >= 1 ? 'accent' : '' };
}

async function savePatterns(analysis, t) {
  const o = outlier(t);
  for (const p of list(analysis?.patterns)) {
    if (!p?.name) continue;
    const kind = String(p.kind || 'hook').toLowerCase().split(/[^a-z]/)[0];
    const ex = { teardownId: t.id, link: t.link, creator: t.creator, ratio: o ? +o.r.toFixed(1) : null };
    const found = S.patterns.find(x => x.name.toLowerCase() === p.name.toLowerCase());
    if (found) { const exs = list(found.examples).filter(e => e.teardownId !== t.id); await store.put('patterns', found.id, { ...found, examples: [...exs, ex] }); }
    else await store.put('patterns', uid(), { name: p.name, kind: ['hook','structure','format'].includes(kind) ? kind : 'hook', description: p.description || '', platforms: [t.platform], examples: [ex] });
  }
}

// ================= V5 SCRIPTS =================
const STAGES = [
  ['beats', 'Beat outline'], ['script', 'Full script'], ['shots', 'Shot list'], ['captions', 'Captions'],
];
VIEWS_RENDER_.scripts = () => {
  const c = UI.scriptId && get('concepts', UI.scriptId);
  return `<div class="vhead"><div><div class="eyebrow">V5 · From concept to shoot</div><h1>${c ? esc(c.title) : 'Script developer'}</h1>
    <p>${c ? esc(c.logline) : 'Pick a saved concept. It builds in four stages: beats, full script, shot list and captions. Edit each stage before moving on.'}</p></div>
    ${c ? `<div class="actions"><button class="btn" id="sc-pick">Change concept</button></div>` : ''}</div>
  ${c ? `<div id="sc-editor"></div>` : `<div class="grid-cards" id="sc-picker"></div>`}`;
};
function scriptDoc(id) { return get('scripts', id) || { id, stages: {}, done: {} }; }
function spokenLines(text) {
  const out = [];
  for (const line of String(text || '').split('\n')) {
    const m = line.match(/^\s*(VO|ON CAMERA|DIALOGUE)(\s*\([^)]*\))?\s*:\s*(.*)$/i);
    if (m && m[3].trim()) out.push(m[3].trim());
  }
  return out;
}
function readTime(text) {
  const spoken = spokenLines(text);
  const words = (spoken.length ? spoken.join(' ') : String(text || '')).split(/\s+/).filter(Boolean).length;
  const sec = Math.round(words / wpm() * 60);
  return { words, sec, spokenOnly: !!spoken.length, label: `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` };
}
PAINT.scripts = (what) => {
  const picker = $('#sc-picker');
  if (picker && UI.scriptId && get('concepts', UI.scriptId)) { render(); return; }
  if (picker) {
    const cs = [...S.concepts].sort((a, b) => (S.scripts.some(x => x.id === b.id) - S.scripts.some(x => x.id === a.id)) || (b.rating || 0) - (a.rating || 0));
    picker.innerHTML = cs.length ? cs.map(c => { const d = get('scripts', c.id); const n = d ? STAGES.filter(([k]) => d.done?.[k]).length : 0; return `<div class="item click" data-to-script="${c.id}" tabindex="0" role="button">
      <div class="meta">${c.series ? `<span class="chip accent">${esc(c.series)}</span>` : ''}<span class="chip ${n === 4 ? 'ok' : ''}">${d ? n + '/4 stages' : 'Not started'}</span>${c.rating ? `<span style="color:var(--star)">${'★'.repeat(c.rating)}</span>` : ''}</div>
      <h3>${esc(c.title)}</h3><p>${esc(c.logline)}</p></div>`; }).join('')
      : `<div class="empty"><strong>No saved concepts.</strong>Save a concept to the board first, then develop it here.</div>`;
    return;
  }
  const ed = $('#sc-editor'); if (!ed) return;
  if (what && what !== 'scripts' && what !== '*') return;
  // keep the editor stable while someone is typing in it or Claude is writing
  if (what && ed.childElementCount && (generating || stageT || ed.contains(document.activeElement))) { paintStageRail(); return; }
  paintScriptEditor();
};
function paintStageRail() {
  const d = scriptDoc(UI.scriptId); const rail = $('#sc-rail'); if (!rail) return;
  rail.innerHTML = STAGES.map(([k, l], i) => `${i ? '<span class="wire"></span>' : ''}<button data-stage="${k}" class="${d.done?.[k] ? 'done' : ''} ${UI.stage === k ? 'cur' : ''}"><span class="dia"></span>${l}</button>`).join('') + `<span class="wire"></span><button data-stage="export" class="${UI.stage === 'export' ? 'cur' : ''}"><span class="dia"></span>Export</button>`;
}
function paintScriptEditor() {
  const ed = $('#sc-editor'); const c = get('concepts', UI.scriptId); if (!ed || !c) return;
  const d = scriptDoc(c.id);
  const st = UI.stage;
  let body;
  if (st === 'export') {
    const rt = readTime(d.stages?.script);

    <div class="scroll"><div class="guide"></div><div class="text" id="tp-text"></div></div></div>`;

  const apply = () => { el.style.transform = `translateY(${-y}px)` + ($('#tp-mirror').checked ? ' scaleX(-1)' : ''); };
  const step = t => { if (!playing) return; const dt = last ? (t - last) / 1000 : 0; last = t; y += dt * +$('#tp-speed').value; apply(); raf = requestAnimationFrame(step); };

      catch (err) { $('#bc-out').innerHTML = `<p class="err">${esc(errCopy(err))}</p>`; } }); return; }
  if (t.id === 'ex-prompter') return openPrompter(prompterText(scriptDoc(UI.scriptId)));
  if (t.id === 'ex-copy') { const txt = packageText(get('concepts', UI.scriptId), scriptDoc(UI.scriptId)); try { await navigator.clipboard.writeText(txt); toast('Package copied'); } catch { drawer(`<h2>Copy the package</h2><textarea class="code" id="copy-box">${esc(txt)}</textarea>`); $('#copy-box').select(); } return; }
  if (t.id === 'ex-dl' || t.id === 'ex-dl-tp') { const c = get('concepts', UI.scriptId); const d = scriptDoc(UI.scriptId); const slug = c.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'script';
    try { await DL.save(t.id === 'ex-dl' ? { filename: slug + '.md', data: packageText(c, d) } : { filename: slug + '-teleprompter.txt', data: prompterText(d) }); } catch (err) { if (err?.code && err.code !== 'cancelled' && err.code !== 'declined') toast('The download did not start.'); } return; }

  // generic
  if (ds.del) { const [coll, id] = ds.del.split(':');
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; const old = t.textContent; t.textContent = 'Press again to delete'; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ''; t.textContent = old; } }, 3000); return; }
    await store.del(coll, id); if (ds.close) closeDrawer(); toast('Deleted'); return; }
  if (ds.openTd) return openTeardown(ds.openTd);
  if (ds.openDg) return openDigest(ds.openDg);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"].item')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && $('#scrim')) closeDrawer();
});
document.addEventListener('mousedown', e => { if (e.target.id === 'scrim') closeDrawer(); });

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bk) { draft()[el.dataset.bk] = el.value; markBibleDirty(); return; }
  if (el.dataset.arr) { const b = draft(); const arr = list(b[el.dataset.arr]); arr[+el.dataset.i] = { ...arr[+el.dataset.i], [el.dataset.k]: el.value }; b[el.dataset.arr] = arr; markBibleDirty(); return; }
  if (el.id === 'sc-text') { scheduleStageSave(); updateReadTime(); return; }
  if (el.dataset.cnote) { clearTimeout(el._t); el._t = setTimeout(() => { const c = get('concepts', el.dataset.cnote); if (c && c.notes !== el.value) store.put('concepts', c.id, { ...c, notes: el.value }); }, 900); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.status) { const c = get('concepts', el.dataset.status); if (c) await store.put('concepts', c.id, { ...c, status: el.value }); return; }
  if (el.id === 'td-images' || el.id === 'wl-images') {
    const files = [...el.files].slice(0, IMG?.maxCount || 4);
    if (el.id === 'td-images') UI.tdImages = files; else UI.watchImages = files;
    $(el.id === 'td-images' ? '#td-thumbs' : '#wl-thumbs').innerHTML = files.map(f => `<img alt="" src="${URL.createObjectURL(f)}">`).join('');
  }
});
document.addEventListener('focusout', e => { if (e.target.dataset?.cnote) { const el = e.target; clearTimeout(el._t); const c = get('concepts', el.dataset.cnote); if (c && c.notes !== el.value) store.put('concepts', c.id, { ...c, notes: el.value }); } });

let stageT;
function scheduleStageSave() { const s = $('#sc-saved'); if (s) s.textContent = 'Editing…'; clearTimeout(stageT); stageT = setTimeout(saveStage, 1200); }
async function flushStage() { if (stageT) { clearTimeout(stageT); stageT = null; await saveStage(); } }
async function saveStage() {
  stageT = null; const box = $('#sc-text'); if (!box || !UI.scriptId || UI.stage === 'export') return;
  const val = box.value; if (val === 'Thinking…') return;
  const d = clone(scriptDoc(UI.scriptId)); if ((d.stages?.[UI.stage] || '') === val) { const s = $('#sc-saved'); if (s) s.textContent = 'Saved'; return; }
  d.stages = { ...d.stages, [UI.stage]: val }; await store.put('scripts', d.id, d);
  const s = $('#sc-saved'); if (s) s.textContent = 'Saved';
}
function updateReadTime() { const el = $('#sc-rt'); const box = $('#sc-text'); if (UI.stage !== 'script' || !box) return; const rt = readTime(box.value);
  if (el) el.textContent = `${rt.label} read · ${rt.words} words`; }
function clearTdForm() { ['td-link','td-creator','td-followers','td-views','td-likes','td-comments','td-transcript','td-notes'].forEach(id => { const el = $('#' + id); if (el) el.value = ''; }); UI.tdImages = []; const th = $('#td-thumbs'); if (th) th.innerHTML = ''; const fi = $('#td-images'); if (fi) fi.value = ''; }
function clearCompForm() { $$('#cp-form input, #cp-form textarea').forEach(el => el.value = ''); $('#cp-title').textContent = 'Add a competitor'; }
window.addEventListener('beforeunload', () => { if (stageT) saveStage(); });

// ---------- boot ----------
render();
store.init();
initSample();
})();
</script>
